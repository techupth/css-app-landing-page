<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Acme App</title>
  </head>
  <body>
    <!-- Start Coding Here -->

    <section class="contact-section">
      <h2 class="contact-header">Get in Touch</h2>
      <form class="contact-form">
        <label for="name" id="lb-name">Name</label>
        <input type="text" placeholder="John Doe" id="name" />
        <label for="email" id="lb-email">Email</label>
        <input type="email" placeholder="john@example.com" id="email" />
        <label for="message" id="lb-msg">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Your message..."
        ></textarea>
        <div class="btn">
          <button type="submit" class="btn-submit">Submit</button>
        </div>
      </form>
    </section>
    <footer class="footer-web">
      <div class="footer-inner">
        <p>Acme productivity app ©2024</p>
        <nav class="footer-nav">
          <a href="">FAQ</a>
          <a href="">Terms</a>
          <a href="">AI Policy</a>
          <a href="">Pricing</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
